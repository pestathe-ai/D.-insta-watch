name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup piattaforme
        run: |
          set -o pipefail
          if ! ./tool/setup_platforms.sh 2>&1 | tee x.log; then
            grep -n -i -E 'error|failed|exception|because|version solving' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=setup::$(cat err.txt)"
            exit 1
          fi

      - name: Analisi codice
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee x.log; then
            grep -n -E 'error' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=analyze::$(cat err.txt)"
            exit 1
          fi
          # Mostra anche warning e info come annotazione (non bloccante).
          grep -n -E 'warning|info' x.log | head -30 \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > warn.txt || true
          if [ -s warn.txt ]; then echo "::warning title=analyze-warnings::$(cat warn.txt)"; fi

      - name: Test
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee x.log; then
            grep -n -i -E 'error|failed|exception|Expected|Actual|Which|\.dart [0-9]+:[0-9]+' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=test::$(cat err.txt)"
            exit 1
          fi

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee x.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|\.dart:[0-9]+' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=build::$(cat err.txt)"
            exit 1
          fi

      - name: Firma APK
        run: |
          set -o pipefail
          PASS=$(cat tool/signing/password.txt)
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if ! "${BT}apksigner" sign --ks tool/signing/app.jks --ks-key-alias app \
                 --ks-pass pass:$PASS --key-pass pass:$PASS "$apk" 2>&1 | tee x.log; then
              echo "::error title=sign::$(tail -5 x.log | awk 'BEGIN{ORS="%0A"} {print}')"
              exit 1
            fi
            "${BT}apksigner" verify "$apk"
          done
          ls -la build/app/outputs/flutter-apk/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D. Insta Watch build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*-release.apk
          body: |
            Scarica **app-arm64-v8a-release.apk** (quasi tutti i telefoni recenti).
            Telefoni vecchi: app-armeabi-v7a-release.apk.
